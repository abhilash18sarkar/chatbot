<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 800px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.6);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .header {
      padding: 15px;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: bold;
    }
    .chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 70%;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
    }
    .bot {
      align-self: flex-start;
      background: #374151;
    }
    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #333;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    .center {
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app" class="container"></div>

  <script>
    const app = document.getElementById("app");
    let apiKey = "";
    let messages = [];

    function renderLogin() {
      app.innerHTML = `
        <div class="header center">Enter Gemini API Key</div>
        <div style="padding:20px; display:flex; flex-direction:column; gap:10px;">
          <input id="apiKeyInput" type="password" placeholder="Paste API key" />
          <button onclick="handleLogin()">Continue</button>
        </div>
      `;
    }

    function handleLogin() {
      const input = document.getElementById("apiKeyInput");
      if (input.value.trim()) {
        apiKey = input.value.trim();
        renderChat();
      }
    }

    function renderChat() {
      app.innerHTML = `
        <div class="header">Gemini Chatbot</div>
        <div id="chat" class="chat"></div>
        <div class="input-area">
          <input id="userInput" placeholder="Ask something..." />
          <button onclick="sendMessage()">Send</button>
        </div>
      `;
    }

    function addMessage(role, text) {
      messages.push({ role, text });
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";

      const chat = document.getElementById("chat");
      const loading = document.createElement("div");
      loading.className = "message bot";
      loading.textContent = "Thinking...";
      chat.appendChild(loading);

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              { parts: [{ text }] }
            ]
          })
        });

        const data = await response.json();
        loading.remove();

        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "No response";
        addMessage("bot", reply);
      } catch (e) {
        loading.remove();
        addMessage("bot", "Error fetching response");
      }
    }

    renderLogin();
  </script>
</body>
</html>
