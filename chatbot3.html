<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful - AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-tertiary: #252d4d;
            --accent: #00d4ff;
            --accent-dark: #0099cc;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --user-msg: #1e3a5f;
            --ai-msg: #2a2a3e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* KEY INPUT SCREEN */
        .key-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            animation: fadeIn 0.5s ease-out;
        }

        .key-screen.hidden {
            display: none;
        }

        .key-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--bg-tertiary);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.1);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .key-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .key-header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .key-header p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .key-input-group {
            margin-bottom: 20px;
        }

        .key-input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .key-input-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .key-input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.05);
        }

        .key-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .key-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .key-btn:active {
            transform: translateY(0);
        }

        .key-error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .key-error.show {
            display: block;
        }

        /* CHAT SCREEN */
        .chat-screen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            visibility: hidden;
        }

        .chat-screen.active {
            visibility: visible;
        }

        .chat-header {
            padding: 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideInUp 0.4s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: var(--user-msg);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: var(--ai-msg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .input-container {
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--bg-tertiary);
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            resize: none;
            max-height: 100px;
        }

        #messageInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
            background: rgba(0, 212, 255, 0.05);
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .key-container {
                margin: 20px;
                max-width: none;
            }

            .message-content {
                max-width: 85%;
            }

            .input-container {
                padding: 12px;
            }

            .chat-header {
                padding: 12px;
            }

            .messages-container {
                padding: 12px;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- API KEY INPUT -->
    <div class="key-screen" id="keyScreen">
        <div class="key-container">
            <div class="key-header">
                <h1>Mindful</h1>
                <p>Enter your Gemini API key to get started</p>
            </div>
            <div class="key-input-group">
                <label for="apiKeyInput">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="your-gemini-api-key">
            </div>
            <button class="key-btn" id="submitKeyBtn">Start Chatting</button>
            <div class="key-error" id="keyError"></div>
        </div>
    </div>

    <!-- CHAT INTERFACE -->
    <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
            <h2>Mindful Chat</h2>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">→</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'gemini';
        const GEMINI_API = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';

        const keyScreen = document.getElementById('keyScreen');
        const chatScreen = document.getElementById('chatScreen');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const submitKeyBtn = document.getElementById('submitKeyBtn');
        const keyError = document.getElementById('keyError');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        let apiKey = '';
        let conversationHistory = [];

        // Auto-grow textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        });

        // Handle Enter key (Shift+Enter for newline)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // API Key Submission
        submitKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showKeyError('Please enter a valid API key');
                return;
            }
            apiKey = key;
            keyScreen.classList.add('hidden');
            chatScreen.classList.add('active');
            messageInput.focus();
        });

        // Allow Enter on key input
        apiKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitKeyBtn.click();
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            apiKey = '';
            conversationHistory = [];
            messagesContainer.innerHTML = '';
            chatScreen.classList.remove('active');
            keyScreen.classList.remove('hidden');
            apiKeyInput.value = '';
            keyError.classList.remove('show');
            apiKeyInput.focus();
        });

        // Send Message
        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !apiKey) return;

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingId = addTypingIndicator();

            try {
                const response = await fetch(`${GEMINI_API}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: message }]
                        }],
                        generationConfig: {
                            maxOutputTokens: 500,
                            temperature: 0.7
                        }
                    })
                });

                removeMessage(typingId);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Error');
                }

                const data = await response.json();
                const aiMessage = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, no response.';
                addMessage(aiMessage, 'ai');
            } catch (err) {
                removeMessage(typingId);
                addMessage(`Error: ${err.message}`, 'ai');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            messagesContainer.appendChild(msg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return msg;
        }

        function addTypingIndicator() {
            const msg = document.createElement('div');
            msg.className = 'message ai';
            msg.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            msg.id = `typing-${Date.now()}`;
            messagesContainer.appendChild(msg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return msg.id;
        }

        function removeMessage(id) {
            const msg = document.getElementById(id);
            if (msg) msg.remove();
        }

        function showKeyError(text) {
            keyError.textContent = text;
            keyError.classList.add('show');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        apiKeyInput.focus();
    </script>
</body>
</html>
